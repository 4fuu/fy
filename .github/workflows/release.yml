name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Verify tag and package version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'fy').version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
              throw "Tag $env:GITHUB_REF_NAME does not match Cargo version $version"
          }
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --locked
      - name: Build release executable
        run: cargo build --release --locked
      - name: Prepare release assets
        shell: pwsh
        run: |
          $asset = Join-Path $env:RUNNER_TEMP 'fy.exe'
          Copy-Item target\release\fy.exe $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *fy.exe" | Set-Content "$asset.sha256" -Encoding ascii
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --json tagName | Out-Null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $env:GITHUB_REF_NAME `
                "$env:RUNNER_TEMP\fy.exe" `
                "$env:RUNNER_TEMP\fy.exe.sha256" `
                "LICENSE" --clobber
          } else {
              gh release create $env:GITHUB_REF_NAME `
                "$env:RUNNER_TEMP\fy.exe" `
                "$env:RUNNER_TEMP\fy.exe.sha256" `
                "LICENSE" `
                --verify-tag --generate-notes --title $env:GITHUB_REF_NAME
          }
      - name: Update Scoop manifest on main
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          git fetch origin main
          git switch --force-create main origin/main
          & .\scripts\update-scoop.ps1 -Version $version -Executable "$env:RUNNER_TEMP\fy.exe"
          if (git diff --quiet -- bucket/fy.json) {
              exit 0
          }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bucket/fy.json
          git commit -m "chore: update Scoop manifest for v$version"
          git push origin main
