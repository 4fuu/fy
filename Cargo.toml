[package]
name = "fy"
version = "0.1.0"
edition = "2024"
description = "A lightweight Windows selection translator powered by OpenAI-compatible APIs"
license = "GPL-3.0-only"
repository = "https://github.com/4fuu/fy"
homepage = "https://github.com/4fuu/fy"
readme = "README.md"
keywords = ["translation", "windows", "openai", "tray"]
categories = ["gui"]

[dependencies]
anyhow = "1.0"
async-openai = { version = "0.41.3", default-features = false, features = ["byot", "chat-completion", "completions", "responses", "rustls"] }
futures = "0.3"
isolang = "2.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
selection = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.47", features = ["rt-multi-thread", "time"] }
toml = "0.9"
whatlang = "0.18"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
